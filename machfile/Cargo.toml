[package]
name = "machfile"
version = "0.3.1"
edition = "2024"
description = "A simple task system, for when a build system is to much"
repository = "https://github.com/machfile/machfile"
license = "MIT"
categories = ["development-tools::build-utils"]

[dependencies]
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
serde-saphyr = "0.0.29"
