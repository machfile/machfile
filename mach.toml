[run]
script = "cargo run"
desc = "Run with debug logging"
[run.options]
environment.RUST_LOG = "mach=debug,info"
allow_args = true

[build]
script = "cargo build"
desc = "Build the project"

[release]
script  = "cargo build --release"

[clean]
script = "rm -rf target"
desc = "Remove cache and outputs"

[test]
script = "cargo test"
desc = "Run rust tests"
options.allow_args = true

[check_target_size]
script = "du -d1 -h"
desc = "Check directory sizes of cache dirs"
options.working_directory = "target"

[install]
script = "cargo install --path ."
desc = "Install the current version"
options.working_directory = "machfile-cli"

[clean_install]
desc = "Clean dependencies and artifacts, then install the current version"
deps = ["clean", "install"]

