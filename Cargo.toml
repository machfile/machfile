[package]
name = "machfile"
version = "0.1.0-alpha.1"
edition = "2024"
description = "A simple task system, for when a build system is to much"
repository = "https://github.com/machfile/mach"
license = "MIT"
categories = ["command-line-utilities"]

[lints.clippy]
pedantic = "warn"

[dependencies]
clap = { version = "4.5.57", features = ["cargo", "string"] }
clap_complete = "4.5.66"
crossterm = "0.29.0"
env_logger = "0.11.8"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.11"

[[bin]]
name = "mach"
path = "src/main.rs"
